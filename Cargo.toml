[package]
name = "rusty-croc"
version = "0.1.0"
edition = "2021"
description = "Rust port of croc (https://github.com/schollz/croc) — secure peer-to-peer file transfer"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
argon2 = "0.5"
rand = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", features = ["arithmetic"] }
p384 = { version = "0.13", features = ["arithmetic"] }
p521 = { version = "0.13", features = ["arithmetic"] }
crypto-bigint = { version = "0.7", features = ["subtle"] }
subtle = "2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
md-5 = "0.10"
murmur3 = "0.5"
highway = "1"
if-addrs = "0.13"
socket2 = { version = "0.5", features = ["all"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
qrcode = { version = "0.14", default-features = false }
ignore = "0.4"
zeroize = "1"

[dev-dependencies]
hex = "0.4"

[[bin]]
name = "rusty-croc"
path = "src/main.rs"

[lib]
name = "rusty_croc"
path = "src/lib.rs"
